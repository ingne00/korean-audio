var voice='f';try{voice=localStorage.getItem('voice')||'f';}catch(e){}
function src(b){return (voice==='m'&&b.getAttribute('data-m'))||b.getAttribute('data-src');}

try{localStorage.setItem('voice',voice);}catch(e){}showVoice();});});showVoice();
