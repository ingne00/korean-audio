function mark(b){if(btn)btn.classList.remove('on');btn=b;if(b)b.classList.add('on');}
function stop(){q=[];a.pause();mark(null);if(all){all.classList.remove('on');all.textContent=label;}}
function next(){if(q.length){play(q.shift());}else{stop();}}
var voice='f';try{voice=localStorage.getItem('voice')||'f';}catch(e){}
function src(b){return (voice==='m'&&b.getAttribute('data-m'))||b.getAttribute('data-src');}

try{localStorage.setItem('voice',voice);}catch(e){}showVoice();});});showVoice();
function play(b){mark(b);a.src=src(b);var p=a.play();if(p&&p.catch)p.catch(function(){});}

document.querySelectorAll('button.p').forEach(function(b){b.addEventListener('click',function(){
if(btn===b&&!a.paused){stop();return;}q=[];if(all){all.classList.remove('on');all.textContent=label;}play(b);});});

q=Array.prototype.slice.call(document.querySelectorAll('button.p'));all.classList.add('on');all.textContent='\u25A0 Stop';next();});})();</script></body></html>
